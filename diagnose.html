<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>キレイン｜あなたの店の"清潔リスク"を無料診断</title>
<meta name="description" content="Googleに書かれた既存の口コミを第三者の目で解析。お客様が口に出さなかった清潔面の"惜しい所"を、無料で可視化します。" />
<style>
  :root{
    --pine:#0e3a33; --mint:#1ea487; --mint-soft:#e7f5f0; --gold:#c2a25f;
    --ink:#1c2b28; --muted:#6b7d78; --line:#e4ece9; --bg:#f6f9f8; --radius:18px;
    --risk-low:#1ea487; --risk-mid:#e0a100; --risk-high:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{font-weight:800;color:var(--pine);font-size:18px;letter-spacing:.5px}
  .brand small{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
  .back{font-size:13px;color:var(--muted);text-decoration:none}
  .hero{background:linear-gradient(155deg,#0e3a33,#08221e);color:#fff;padding:46px 0 40px;text-align:center}
  .hero h1{font-size:26px;font-weight:800;margin:0 0 12px;line-height:1.5}
  .hero h1 .ac{color:#7fe0c6}
  .hero p{font-size:14px;color:#cfe3dd;margin:0 auto;max-width:520px}
  .search-card{background:#fff;border-radius:var(--radius);box-shadow:0 20px 50px -24px rgba(14,58,51,.4);padding:22px;margin:-26px auto 0;position:relative;z-index:5}
  .search-label{font-size:13px;font-weight:700;color:var(--pine);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  #storeInput{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.2s}
  #storeInput:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px}
  .section{padding:28px 0 60px}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:30px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 診断結果カード */
  .diag{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-top:22px;box-shadow:0 16px 40px -26px rgba(14,58,51,.3)}
  .diag-head{padding:20px 22px;border-bottom:1px solid var(--line)}
  .diag-name{font-size:18px;font-weight:800;color:var(--ink)}
  .diag-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .risk-row{display:flex;align-items:center;gap:18px;padding:22px;flex-wrap:wrap}
  .risk-badge{flex-shrink:0;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;color:#fff;text-align:center}
  .risk-badge .rl{font-size:26px;font-weight:800;line-height:1}
  .risk-badge .rt{font-size:11px;opacity:.9;margin-top:3px}
  .risk-low{background:linear-gradient(150deg,#25b598,#159079)}
  .risk-mid{background:linear-gradient(150deg,#f0b429,#d99400)}
  .risk-high{background:linear-gradient(150deg,#e05a4d,#b32c1e)}
  .risk-desc{flex:1;min-width:200px}
  .risk-desc h3{margin:0 0 6px;font-size:15px;color:var(--pine)}
  .risk-desc p{margin:0;font-size:13px;color:var(--muted);line-height:1.7}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 22px 20px}
  .stat{background:var(--bg);border-radius:12px;padding:14px;text-align:center}
  .stat .n{font-size:26px;font-weight:800;color:var(--pine);line-height:1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:5px}
  /* ロック(ペイウォール) */
  .locked{margin:0 22px 22px;border:1.5px dashed var(--line);border-radius:14px;padding:18px;position:relative;background:#fbfdfc}
  .locked h4{margin:0 0 12px;font-size:13px;color:var(--pine);display:flex;align-items:center;gap:6px}
  .locked-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  .locked-pri{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0;margin-top:2px}
  .pri-high{color:#c0392b;background:#fff5f5}
  .pri-mid{color:#a5822f;background:#fdf6e6}
  .locked-text{font-size:12.5px;color:var(--ink);filter:blur(4.5px);user-select:none;flex:1}
  .paywall{text-align:center;padding:16px 0 4px}
  .paywall .price{font-size:15px;font-weight:800;color:var(--pine)}
  .paywall .price b{font-size:22px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;text-decoration:none;border-radius:12px;padding:14px 22px;font-size:14px;cursor:pointer;border:none}
  .btn-mint{background:var(--mint);color:#06231d}
  .btn-pine{background:var(--pine);color:#fff}
  .btn-block{width:100%}
  .fallback{background:#fff8e1;border-radius:14px;padding:20px;text-align:center;margin-top:22px}
  .fallback h3{margin:0 0 8px;font-size:15px;color:#7a6000}
  .fallback p{margin:0 0 14px;font-size:13px;color:#8a7220}
  .footnote{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.8}
  .pre-tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#8a6d00;background:#fff8e1;padding:3px 10px;border-radius:99px}
  .quote{margin:18px 22px 4px;background:#fbf7ef;border:1px solid #ece0c8;border-left:4px solid var(--gold);border-radius:12px;padding:16px 18px}
  .quote-label{font-size:11px;font-weight:700;color:#a5822f;margin-bottom:8px}
  .quote blockquote{margin:0;font-size:14px;line-height:1.7;color:var(--ink);font-weight:600}
  .quote-attr{font-size:11px;color:var(--muted);margin-top:8px}
  .quote-attr a{color:var(--mint)}
  .risk-badge{width:92px;height:92px}
  @media(max-width:520px){ .stat-grid{grid-template-columns:1fr} .risk-badge{width:100px;height:100px} }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Kirein <small>キレイン</small></div>
    <a class="back" href="/">← キレインTOPへ</a>
  </div>

  <div class="hero">
    <div class="wrap">
      <h1>あなたの店の<span class="ac">"清潔リスク"</span>を、<br>無料で診断します。</h1>
      <p>Googleに書かれた既存の口コミを、第三者の目で解析。お客様が口に出さなかった清潔面の"惜しい所"を可視化します。<b style="color:#fff">集客サービスではありません。</b></p>
    </div>
  </div>

  <div class="wrap">
    <div class="search-card">
      <div class="search-label">🔍 店名を入力してください</div>
      <input id="storeInput" type="text" placeholder="例：〇〇食堂 名古屋 栄" autocomplete="off" />
      <div class="hint">店名を入れて候補から選ぶと、その場で無料診断が始まります。訪問は不要です。</div>
    </div>

    <div class="section">
      <div id="result"></div>
    </div>
  </div>

<script>
/* ========== 清潔リスク自動診断エンジン ========== */
// v2：精度優先・近接ルール（店内＋店外）。prospect.mjs と同一ロジック。
const CLEAN_AREAS = [
  // 🏠 店内（客が体験）
  { key:'トイレ',           re:/トイレ|お手洗|化粧室|洗面所?|便所/ },
  { key:'席・テーブル',     re:/テーブル|座席|カウンター|お?席|シート/ },
  { key:'床・店内',         re:/床|店内|通路|内装|階段/ },
  { key:'食器・グラス',     re:/食器|グラス|コップ|お皿|カトラリー|お?箸|おしぼり/ },
  { key:'手洗い・衛生',     re:/手洗|石鹸|石けん|消毒/ },
  // 🚪 店外（通行人・近隣＝非客が気づく）
  { key:'店前・入口',       re:/店[のの　 ]?前|店頭|入口|入り口|玄関|軒先|外観|外壁/, ext:true },
  { key:'ゴミ置き場',       re:/ゴミ|ごみ|生ゴミ|ゴミ袋|ゴミ置|ゴミ捨/, ext:true },
  { key:'裏・バックヤード', re:/裏[口手にのを　 ]|バックヤード|路地|側溝|排水溝|溝/, ext:true },
  { key:'外の匂い・排気',   re:/排気|換気扇|ダクト|近隣|ご近所|住民/, ext:true },
];
// 明確な汚れ語（あいまいな 残念/気になる は入れない）
const HARD_NEG = /汚[いくれかっ]|きたな|不潔|べたべた|ベタベタ|べたつ|ぬめ|ぬる|ほこり|埃|カビ|かび|虫|ゴキブリ|コバエ|ハエ|ネズミ|散らか|放置|溜ま|山積|べとべと/;
// 明確に負の匂い（食べ物の「香り」は含めない）
const NEG_SMELL = /悪臭|異臭|カビ臭|かび臭|下水.{0,3}臭|ドブ臭|生ゴミ.{0,3}臭|排水.{0,3}臭|臭[いくかっ]|くさ[いくかっ]|におい.{0,5}(気にな|きつ|ひど|する)|匂い.{0,5}(気にな|きつ|ひど)|タバコ.{0,5}(臭|きつ|ひど|充満)|煙.{0,5}(充満|きつ|ひど)/;
const NEG_SMELL_STANDALONE = /悪臭|異臭|カビ臭|かび臭|下水.{0,3}臭|ドブ臭|生ゴミ.{0,3}臭/;
// 弱いネガ（清潔エリア語の近く＋★4以下レビューに限り拾う。抽出エンジンと同じ較正）
const SOFT_NEG = /残念|気にな|いまひとつ|イマイチ|微妙|不衛生|清潔感.{0,3}(な|欠|薄)|綺麗とは|きれいとは|古[いくかっ]/;
// ポジティブ（清潔面の好評）
const POS_RE = /(きれい|綺麗|キレイ|清潔|ピカピカ|衛生的|行き届|手入れ.{0,3}(され|行き届)|清潔感)/;
// エリア語の「すぐ近く(±N)」に 汚れ語/負の匂い/(★4以下なら)弱いネガ がある時だけ清潔ネガ
function classifyReview(r){
  const text = r && r.text;
  if(!text) return null;
  const rating = Number(r && r.rating) || 0;
  const meta = { text, author: r.author_name || '', rating: r.rating || null };
  const N = 16;
  for(const a of CLEAN_AREAS){
    const re = new RegExp(a.re.source, 'g'); let m;
    while((m = re.exec(text))){
      const win = text.slice(Math.max(0, m.index - N), m.index + m[0].length + N);
      if(HARD_NEG.test(win) || NEG_SMELL.test(win)) return { s:'neg', area:a.key, ext:!!a.ext, ...meta };
      if((!rating || rating <= 4) && SOFT_NEG.test(win)) return { s:'neg', area:a.key, ext:!!a.ext, soft:true, ...meta };
    }
  }
  // 場所語が無くても、明確な悪臭は「外の匂い」として拾う（近隣クレーム型）
  if(NEG_SMELL_STANDALONE.test(text)) return { s:'neg', area:'外の匂い・排気', ext:true, ...meta };
  if(POS_RE.test(text)) return { s:'pos', area:'清潔全般', ext:false, ...meta };
  return null;
}
function diagnose(place){
  const reviews = place.reviews || [];
  const findings = reviews.map(r => classifyReview(r)).filter(Boolean);
  const negs = findings.filter(f => f.s==='neg');
  const poss = findings.filter(f => f.s==='pos');
  const rating = place.rating || 0;
  const total  = place.user_ratings_total || 0;

  // リスク判定：ネガ言及数 と Google評価 の合わせ技
  let level;
  if(negs.length >= 2 || (rating && rating < 3.6 && negs.length >= 1)) level = 'high';
  else if(negs.length === 1 || (rating && rating < 4.1)) level = 'mid';
  else level = 'low';

  return {
    level,
    negCount: negs.length,
    posCount: poss.length,
    analyzed: reviews.length,
    rating, total,
    improvements: negs,   // 詳細はロック
  };
}

/* ========== 描画 ========== */
const RISK_META = {
  low:  { cls:'risk-low',  label:'低',  title:'今のところ、清潔リスクは低め。',      desc:'既存の口コミでは、清潔面の目立った不満は見当たりませんでした。ただし「言われていない不満」は口コミには出にくいもの。詳細プランで、実際のお客様の声を継続的に拾えます。' },
  mid:  { cls:'risk-mid',  label:'中',  title:'いくつか"惜しい所"のサインがあります。',  desc:'清潔面で気になる声、または評価の伸び悩みが見られます。放置すると悪い口コミに繋がりやすい水準です。どこを直せばいいか、詳細プランで具体的に。' },
  high: { cls:'risk-high', label:'高',  title:'清潔面が、来店体験の足を引っぱっています。', desc:'複数の口コミで清潔面の不満が指摘されています。悪い口コミがさらに増える前に、優先的に手を打つべき状態です。改善点の詳細をご確認ください。' },
};
function esc(s){ return (s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function renderDiag(place){
  const d = diagnose(place);
  const el = document.getElementById('result');

  if(d.analyzed === 0){
    el.innerHTML = `
      <div class="fallback">
        <h3>まだ口コミが少なく、自動診断ができません</h3>
        <p>このお店はGoogleの口コミが少ないため、既存データからの診断ができませんでした。<br>今後の口コミは、月¥3,000の見張りプランで24時間自動監視できます。</p>
        <a class="btn btn-pine" href="./start.html">¥3,000で見張りを始める →</a>
      </div>`;
    return;
  }

  const m = RISK_META[d.level];
  const negs = d.improvements || [];
  const topNeg = negs[0];                 // 実引用のフック（あれば）
  const gmap = place.url || '';

  // 実引用ブロック（Google帰属つき）＝一番の武器
  const quoteBlock = topNeg ? `
    <div class="quote">
      <div class="quote-label">💬 実際に、公開口コミにこう書かれています</div>
      <blockquote>${esc(topNeg.text.slice(0,120))}${topNeg.text.length>120?'…':''}</blockquote>
      <div class="quote-attr">${topNeg.rating?('★'+topNeg.rating+' '):''}${esc(topNeg.author||'Googleユーザー')}さんの口コミより${gmap?` ・ <a href="${esc(gmap)}" target="_blank" rel="noopener">Googleマップで見る</a>`:''}</div>
    </div>` : '';

  // 追加の気になる声（枚数だけブラーで示唆）
  const lockedItems = negs.slice(1,4).map((f)=>`
      <div class="locked-item">
        <span class="locked-pri pri-mid">・ ${esc(f.area)}</span>
        <span class="locked-text">${esc((f.text||'お客様が指摘した清潔面のポイント').slice(0,40))}…</span>
      </div>`).join('') || `<div class="locked-item"><span class="locked-pri pri-mid">・ これから書かれる口コミ</span><span class="locked-text">今後の清潔面の口コミを24時間見張り、悪い兆候をすぐ通知します</span></div>`;

  el.innerHTML = `
    <div class="diag">
      <div class="diag-head">
        <div class="diag-name">${esc(place.name)}</div>
        <div class="diag-meta">${esc(place.formatted_address||'')} ｜ Google評価 ★${(d.rating||'-')}（${d.total.toLocaleString()}件）</div>
        <span class="pre-tag">🔎 公開口コミの簡易分析</span>
      </div>
      ${quoteBlock}
      <div class="risk-row">
        <div class="risk-badge ${m.cls}"><div><div class="rl">${m.label}</div><div class="rt">リスク兆候</div></div></div>
        <div class="risk-desc"><h3>${m.title}</h3><p>${m.desc}</p></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="n">${d.analyzed}</div><div class="l">解析した公開口コミ</div></div>
        <div class="stat"><div class="n">${d.negCount}</div><div class="l">清潔面で気になる声</div></div>
      </div>
      <div class="locked">
        <h4>🔒 この口コミを見張り、悪化する前に手を打つ</h4>
        ${lockedItems}
        <div class="paywall">
          <div class="price">この口コミを24時間見張り、対応まで — 見張りプラン <b>¥3,000</b>/月</div>
          <div style="font-size:11px;color:var(--muted);margin:6px 0 14px">口コミの自動監視＋悪い兆候アラート＋お客様の声への公開対応＋客に見せる店舗ページ。<b>現地訪問はありません。</b></div>
          <a class="btn btn-mint btn-block" href="./start.html">¥3,000で見張りを始める →</a>
          <a class="btn btn-block" style="background:transparent;color:var(--pine);margin-top:8px;text-decoration:underline;font-size:12px" href="/">キレインについて</a>
        </div>
      </div>
    </div>
    <div class="footnote">
      ※ 本チェックはGoogle等に公開されている口コミ${d.analyzed}件を第三者の目で自動解析した<b>公開口コミにもとづく簡易分析</b>です。点数は目安であり、清潔さを保証・認証するものではありません。<br>
      引用元・投稿者はGoogleマップでご確認いただけます。月¥3,000の見張りプランで、この口コミを継続監視し、対応した姿勢を客に見せられます。
    </div>`;
}

/* ========== Places 連携 ========== */
let acService, placesService, sessionToken;
function initDiagnose(){
  if(!(window.google && google.maps && google.maps.places)){
    document.getElementById('result').innerHTML =
      '<div class="fallback"><h3>地図サービスの読み込みに失敗しました</h3><p>時間をおいて再度お試しください。</p></div>';
    return;
  }
  acService = new google.maps.places.AutocompleteService();
  placesService = new google.maps.places.PlacesService(document.createElement('div'));
  sessionToken = new google.maps.places.AutocompleteSessionToken();

  const input = document.getElementById('storeInput');
  const ac = new google.maps.places.Autocomplete(input, {
    fields:['place_id','name'],
    componentRestrictions:{ country:'jp' },
    types:['establishment'],
  });
  ac.addListener('place_changed', ()=>{
    const p = ac.getPlace();
    if(p && p.place_id) runDiagnosis(p.place_id);
  });

  // 営業フックのリンク（?s=place_id）で開いたら、その店の診断を即実行
  const pid = new URLSearchParams(location.search).get('s');
  if(pid) runDiagnosis(pid);
}
function runDiagnosis(placeId){
  const el = document.getElementById('result');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>既存の口コミを解析しています…</div>';
  placesService.getDetails({
    placeId,
    fields:['name','formatted_address','rating','user_ratings_total','reviews','url'],
    language:'ja',
  }, (place, status)=>{
    if(status === google.maps.places.PlacesServiceStatus.OK && place){
      renderDiag(place);
      el.scrollIntoView({ behavior:'smooth', block:'start' });
    } else {
      el.innerHTML = '<div class="fallback"><h3>お店の情報を取得できませんでした</h3><p>別の店名でお試しください。</p><a class="btn btn-pine" href="/">キレインについて →</a></div>';
    }
  });
}
window.initDiagnose = initDiagnose;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDRfloVijkhdUhF9v_DG7O3JV17Fqd9V7w&libraries=places&language=ja&callback=initDiagnose"></script>
</body>
</html>
