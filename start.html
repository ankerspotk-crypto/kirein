<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>キレイン｜見張りを始める店を選ぶ</title>
<style>
  :root{ --pine:#0e3a33; --mint:#1ea487; --mint-soft:#e7f5f0; --ink:#1c2b28; --muted:#6b7d78; --line:#e4ece9; --bg:#f6f9f8; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  a{color:inherit}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{font-weight:800;color:var(--pine);font-size:18px}
  .brand small{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
  .back{font-size:13px;color:var(--muted);text-decoration:none}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px}
  .step{font-size:12px;font-weight:700;color:var(--mint);letter-spacing:.5px}
  h1{font-size:23px;margin:8px 0 6px;color:var(--pine)}
  .lead{font-size:14px;color:var(--muted);margin:0 0 24px}
  .card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:22px;box-shadow:0 16px 40px -26px rgba(14,58,51,.3)}
  label{font-size:13px;font-weight:700;color:var(--pine);display:block;margin-bottom:8px}
  #storeInput{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;outline:none;transition:.2s}
  #storeInput:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px}
  .picked{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:none}
  .picked .nm{font-weight:800;font-size:15px;color:var(--ink)}
  .picked .ad{font-size:12px;color:var(--muted);margin-top:3px}
  .btn{display:block;width:100%;text-align:center;margin-top:18px;padding:15px;border-radius:12px;font-weight:800;font-size:15px;text-decoration:none;border:none;cursor:pointer}
  .btn-go{background:var(--mint);color:#06231d;opacity:.4;pointer-events:none;transition:.2s}
  .btn-go.on{opacity:1;pointer-events:auto}
  .note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.8;text-align:center}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Kirein <small>キレイン</small></div>
    <a class="back" href="/">← 戻る</a>
  </div>
  <div class="wrap">
    <div class="step">見張りプラン ¥3,000/月</div>
    <h1>見張りを始める店を選ぶ</h1>
    <p class="lead">店名を入れて選ぶと、その店のGoogle口コミを自動監視します。次の画面（Stripe）でお支払い。必要に応じて覆面調査員が調査することもあります。</p>
    <div class="card">
      <label>🔍 あなたのお店</label>
      <input id="storeInput" type="text" placeholder="例：〇〇食堂 名古屋 栄" autocomplete="off" />
      <div class="hint">Googleに載っているお店を選んでください。</div>
      <div class="picked" id="picked">
        <div class="nm" id="pnm"></div>
        <div class="ad" id="pad"></div>
      </div>
      <a class="btn btn-go" id="goBtn" href="#">この店で見張りを始める（月¥3,000）→</a>
      <div class="note">お支払いはStripeの安全な画面で。いつでも解約できます。<br>キレインは清潔さを保証・認証するものではなく、公開口コミの監視と対応の見える化を行います。</div>
    </div>
  </div>

<script>
const PAYMENT_LINK = 'https://buy.stripe.com/3cI00k3nheUx6lg2ar3Nm01';
let picked = null;

function initStart(){
  if(!(window.google && google.maps && google.maps.places)) return;
  const input = document.getElementById('storeInput');
  const ac = new google.maps.places.Autocomplete(input, {
    fields:['place_id','name','formatted_address'],
    componentRestrictions:{ country:'jp' },
    types:['establishment'],
  });
  ac.addListener('place_changed', ()=>{
    const p = ac.getPlace();
    if(!p || !p.place_id) return;
    picked = p;
    document.getElementById('pnm').textContent = p.name || '';
    document.getElementById('pad').textContent = p.formatted_address || '';
    document.getElementById('picked').style.display = 'block';
    const go = document.getElementById('goBtn');
    // Payment Link に client_reference_id=place_id を渡す → webhookで店を紐づけ→監視開始
    go.href = PAYMENT_LINK + '?client_reference_id=' + encodeURIComponent(p.place_id);
    go.classList.add('on');
    // 決済後の橋渡し：戻り先 dashboard.html が ?s= 無しでも今の店を復元できるよう退避
    go.onclick = ()=>{ try{ localStorage.setItem('kirein_store',
      JSON.stringify({ id:p.place_id, name:p.name||'', addr:p.formatted_address||'' })); }catch(e){} };
  });

  applyPreselect();
}

// cert.html等からの ?s=place_id（+n,a）を受けて店を事前選択＝claim動線をつなぐ
function applyPreselect(){
  const sp=new URLSearchParams(location.search);
  const s=sp.get('s'); if(!s) return;
  const setPicked=(name,addr)=>{
    picked={ place_id:s, name:name||'選択したお店', formatted_address:addr||'' };
    document.getElementById('storeInput').value = picked.name;
    document.getElementById('pnm').textContent = picked.name;
    document.getElementById('pad').textContent = picked.formatted_address;
    document.getElementById('picked').style.display='block';
    const go=document.getElementById('goBtn');
    go.href = PAYMENT_LINK + '?client_reference_id=' + encodeURIComponent(s);
    go.classList.add('on');
    go.onclick=()=>{ try{ localStorage.setItem('kirein_store',
      JSON.stringify({ id:s, name:picked.name, addr:picked.formatted_address })); }catch(e){} };
  };
  const n=sp.get('n'), a=sp.get('a');
  if(n){ setPicked(n,a); return; }
  try{
    const svc=new google.maps.places.PlacesService(document.createElement('div'));
    svc.getDetails({ placeId:s, fields:['name','formatted_address'] }, (p,st)=>{
      if(st===google.maps.places.PlacesServiceStatus.OK && p) setPicked(p.name,p.formatted_address);
      else setPicked('','');
    });
  }catch(e){ setPicked('',''); }
}
window.initStart = initStart;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDRfloVijkhdUhF9v_DG7O3JV17Fqd9V7w&libraries=places&language=ja&callback=initStart"></script>
</body>
</html>
