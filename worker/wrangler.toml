name = "kirein-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# kirein.net の /api/* だけ Worker が処理し、それ以外は GitHub Pages(origin) へ通す
routes = [
  { pattern = "kirein.net/api/*", zone_name = "kirein.net" }
]

# 非秘密の設定（秘密ではないので vars でOK）
[vars]
STRIPE_PRICE_ID = "price_XXXXXXXXXXXX"
# Ph2b 通知メールの差出人（Resendで認証したドメインのアドレス）
ALERT_FROM = "キレイン <alert@kirein.net>"
# 通知メール内のダッシュボードURL（?s=place_id&t=token が付与される）
DASHBOARD_URL = "https://kirein.net/dashboard.html"
# Firebase公開APIキー（claim時バックフィルでFirestore(posts・公開読取)を読む用。クライアントHTMLにも載る公開値＝秘密ではない）
FIREBASE_API_KEY = "AIzaSyBmd6J3uyIEkyybGVLlMR5_p9LLiHZQk3U"

# D1（手順③の `wrangler d1 create kirein` で出た database_id を入れる）
[[d1_databases]]
binding = "DB"
database_name = "kirein"
database_id = "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"

# 口コミ監視Cron（6時間ごと）＝Ph2稼働中
[triggers]
crons = ["0 */6 * * *"]

# ⚠️ 秘密は wrangler secret で入れる（ここには書かない）:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put GOOGLE_PLACES_KEY
#   wrangler secret put RESEND_API_KEY        # Ph2b メール通知（re_xxx）
