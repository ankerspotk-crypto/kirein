<style>
:root{
  --pine:#0e3a33;--pine-deep:#082722;--mint:#25b598;--mint-soft:#e6f5f1;
  --gold:#c2a25f;--ink:#182320;--muted:#5d6b66;--line:#e4eae7;
  --bg:#f6f9f8;--card:#fff;--radius:18px;--shadow:0 16px 44px -24px rgba(14,58,51,.3);
  --red:#c0392b;--red-soft:#fff5f5;--amber:#c78a00;--amber-soft:#fdf6e6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif JP",serif}
.wrap{width:min(620px,94vw);margin:0 auto;padding:18px 0 56px}
.logo{display:flex;align-items:center;gap:8px;font-family:"Cormorant Garamond",serif;font-size:21px;color:var(--pine);font-weight:600;padding:12px 0}
.logo svg{width:22px;height:22px}
.logo b{font-family:"Noto Sans JP";font-size:12px;font-weight:700}
.logo .tag{margin-left:auto;font-family:"Noto Sans JP";font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.card-h h2{font-size:15px;color:var(--pine)}
.card-h .sub{font-size:11px;color:var(--muted)}
.card-b{padding:20px 22px}

/* 店ヘッダ */
.st-head{padding:22px;display:flex;align-items:center;gap:16px}
.st-seal{width:60px;height:60px;flex:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--mint),#159079)}
.st-seal .ico{font-size:24px}
.st-info{flex:1}
.st-info .nm{font-family:"Noto Serif JP";font-size:18px;font-weight:700;color:var(--pine)}
.st-info .meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge-live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#fff;background:var(--mint);padding:4px 12px;border-radius:999px;margin-top:6px}
.badge-live .dot{width:7px;height:7px;border-radius:50%;background:#c6ffe9;box-shadow:0 0 0 0 rgba(198,255,233,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,255,233,.7)}70%{box-shadow:0 0 0 7px rgba(198,255,233,0)}100%{box-shadow:0 0 0 0 rgba(198,255,233,0)}}

/* アラート */
.alert{border-left:3px solid var(--red);background:var(--red-soft);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.alert .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.alert .area{font-size:11px;font-weight:700;color:var(--red);background:#fff;border:1px solid #f2c9c2;padding:2px 10px;border-radius:999px}
.alert .src{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.alert .date{font-size:11px;color:var(--muted);margin-left:auto}
.alert .q{font-size:13.5px;line-height:1.7;color:var(--ink)}
.alert .q::before{content:"“";color:#e0a99f;font-weight:700}
.alert .q::after{content:"”";color:#e0a99f;font-weight:700}
.good{text-align:center;padding:8px 0}
.good .ico{font-size:30px}
.good .t{font-size:14px;font-weight:700;color:var(--pine);margin-top:6px}
.good .s{font-size:12px;color:var(--muted);margin-top:4px}

/* 対応フォーム */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--pine);margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;font-family:inherit;font-size:13px;font-weight:700;padding:11px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:.15s}
.seg button.on{border-color:var(--mint);background:var(--mint-soft);color:var(--pine)}
textarea{width:100%;font-family:inherit;font-size:14px;line-height:1.7;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;outline:none;resize:vertical;min-height:96px;transition:.2s}
textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;border:none;font-family:inherit;text-decoration:none;transition:.2s}
.btn-mint{background:var(--mint);color:#062019;width:100%}.btn-mint:hover{background:#1ea487}
.btn-mint:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--muted);line-height:1.8;margin-top:12px;background:var(--bg);border-radius:10px;padding:12px 14px}
.hint b{color:var(--pine)}
.saved{font-size:12.5px;font-weight:700;color:var(--mint);margin-top:10px;text-align:center;min-height:18px}
.curresp{margin-bottom:16px;padding:14px 16px;background:var(--mint-soft);border-radius:10px}
.curresp .st{font-size:13px;font-weight:800;color:var(--pine)}
.curresp .cm{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.7}
.curresp .dt{font-size:11px;color:var(--muted);margin-top:6px}

/* 公開ページ */
.sharerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shareurl{flex:1;min-width:200px;font-family:inherit;font-size:12.5px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybtn{background:var(--pine);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}

/* オンボーディング / 準備中 */
.hero{background:linear-gradient(150deg,var(--pine-deep),#0b2c27);color:#fff;border-radius:var(--radius);padding:34px 26px;text-align:center;box-shadow:var(--shadow)}
.hero .ico{font-size:30px}
.hero h2{font-size:19px;margin:10px 0 8px}
.hero p{font-size:13px;color:#c2d6d0;line-height:1.9;margin-bottom:18px}
.hero .price{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:700}
.hero .price span{font-size:13px;font-family:"Noto Sans JP";color:#9fc4ba}
.hero .btn{background:var(--mint);color:#062019;margin-top:16px}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:6px auto 0;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.err{background:var(--card);border-radius:var(--radius);padding:40px 24px;text-align:center;box-shadow:var(--shadow)}
.err h2{color:var(--pine);font-size:18px;margin-bottom:8px}.err p{color:var(--muted);font-size:13px}
.foot{text-align:center;padding:20px 0;font-size:11px;color:#9fb3ac;line-height:1.9}
.foot a{color:var(--mint);font-weight:700;text-decoration:none}
</style>

    解約はStripeのメールから／お問い合わせ <a href="mailto:kirein.jp@gmail.com">kirein.jp@gmail.com</a>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search);
const API='/api';
const LS_KEY='kirein_store';   // start.html が決済前に place_id を退避

// 決済直後の橋渡し：?s= が無ければ直近に選んだ店を復元
function localPlace(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; }
}
function storeId(){
  return qp.get('s') || (localPlace()||{}).id || '';
}

const RESP={
  responding:{l:'お客様の声に対応中',c:'var(--amber)'},
  responded :{l:'店舗対応済み',      c:'#159079'},
  rechecked :{l:'キレイン再チェック済み',c:'var(--pine)'},
};
let RESP_STATE='responded';   // フォーム選択中の状態

function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso); if(isNaN(d)) return esc(iso);
  const p=n=>('0'+n).slice(-2);
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ── 稼働中の店：本編 ── */
function renderActive(st){
  const name=st.name||localPlace()&&localPlace().name||'あなたのお店';
  const alerts=st.alerts||[];
  const r=st.response||null;
  if(r&&RESP[r.status]) RESP_STATE=r.status;

  const srcMeta={kirein:{l:'キレインのユーザー',c:'#159079',bg:'#e6f5f1'},google:{l:'Googleの口コミ',c:'#c78a00',bg:'#fdf6e6'}};
  // Google（D1）とキレインのユーザー（Firestore・過去分含む）を分けて表示。D1のkirein分はFirestore側に集約するため除外。
  const gAlerts = alerts.filter(a=>(a.source||'google')!=='kirein');
  const gAlertHtml = gAlerts.length
    ? gAlerts.map(a=>{const sm=srcMeta[a.source]||srcMeta.google;
      return `<div class="alert">
        <div class="top"><span class="area">${esc(a.area||'清潔全般')}</span><span class="src" style="color:${sm.c};background:${sm.bg}">${sm.l}</span><span class="date">${fmtDate(a.detected)}</span></div>
        <div class="q">${esc(a.quote||'')}</div>
      </div>`;}).join('')
    : `<div class="good" style="padding:4px 0"><div class="s" style="font-size:12px;color:var(--muted)">Googleの公開口コミに、清潔面の目立ったネガはありません。</div></div>`;

  const segBtn=(k,label)=>`<button data-st="${k}" class="${RESP_STATE===k?'on':''}" onclick="pickResp('${k}')">${label}</button>`;
  const curResp = r ? `<div class="curresp">
      <div class="st">現在の公開状況：${esc((RESP[r.status]||{}).l||r.status)}</div>
      ${r.comment?`<div class="cm">「${esc(r.comment)}」</div>`:''}
      <div class="dt">最終更新：${fmtDate(r.updated)}</div>
    </div>` : '';

  const certUrl=location.origin+'/cert.html?s='+encodeURIComponent(st.id);

  $('#app').innerHTML=`
    <div class="card">
      <div class="st-head">
        <div class="st-seal"><span class="ico">🛡️</span></div>
        <div class="st-info">
          <div class="nm">${esc(name)}</div>
          <div class="meta">最終チェック：${fmtDate(st.last_checked)}</div>
          <span class="badge-live"><span class="dot"></span>見張りプラン 稼働中</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>① 気づく — 清潔の声</h2><span class="sub">店舗だけが見る画面</span></div>
      <div class="card-b">
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">Googleの公開口コミ</div>
        ${gAlertHtml}
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 10px">キレインのユーザーの声（これまでの投稿）</div>
        <div id="kireinVoices"><div class="good" style="padding:4px 0"><div class="s" style="font-size:12px;color:var(--muted)">読み込み中…</div></div></div>
        <div class="hint">清潔に関するネガティブな声だけを拾っています。<b>この内容は店舗だけが見る画面です。</b>お客様が見るページには口コミの中身・投稿者は一切公開されません。</div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>② 直す・見せる — 対応の公表</h2><span class="sub">お客様ページに反映</span></div>
      <div class="card-b">
        ${curResp}
        <div class="field">
          <label>対応の状況</label>
          <div class="seg">
            ${segBtn('responding','🔧 対応中')}
            ${segBtn('responded','✓ 対応済み')}
          </div>
        </div>
        <div class="field">
          <label>お客様に見せるコメント（任意）</label>
          <textarea id="respComment" placeholder="例：手洗い場の清掃頻度を1日3回に見直しました。">${r&&r.comment?esc(r.comment):''}</textarea>
        </div>
        <button class="btn btn-mint" id="saveBtn" onclick="saveResp('${esc(st.id)}')">この内容を公開する</button>
        <div class="saved" id="savedMsg"></div>
        <div class="hint">公開されるのは「対応した事実」とこのコメントだけ。<b>ネガティブな口コミの中身・投稿者情報は公開されません。</b>晒しではなく、清潔に向き合う姿勢を見える化します。</div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><h2>お客様に見せるページ</h2><span class="sub">QR / SNS で共有</span></div>
      <div class="card-b">
        <div class="sharerow">
          <div class="shareurl" id="certUrl">${esc(certUrl)}</div>
          <button class="copybtn" onclick="copyCert()">コピー</button>
          <a class="copybtn" style="text-decoration:none;background:var(--mint);color:#062019" href="${esc(certUrl)}" target="_blank" rel="noopener">開く</a>
        </div>
        <div class="hint">このリンク／QRを店頭やSNSに置くと、お客様に「清潔の声に向き合っている店」であることが伝わります。</div>
      </div>
    </div>`;

  loadKireinVoices(st.id);
}

/* ── キレインのユーザーの声（Firestore・過去分含む／active の店だけ描画）── */
async function loadKireinVoices(placeId){
  const box=document.getElementById('kireinVoices'); if(!box || !placeId) return;
  let t=0; while(!window.db && t<15){ await new Promise(r=>setTimeout(r,200)); t++; }
  if(!window.db){ box.innerHTML='<div class="s" style="font-size:12px;color:var(--muted)">読み込みに失敗しました。時間をおいて再度お試しください。</div>'; return; }
  // created_at は Firestore Timestamp と ISO文字列が混在する → ミリ秒に正規化
  const toMs=(v)=>{
    if(!v) return 0;
    if(typeof v==='object'){
      if(typeof v.toMillis==='function') return v.toMillis();
      if(typeof v.toDate==='function') return v.toDate().getTime();
      if(typeof v.seconds==='number') return v.seconds*1000;
    }
    const d=new Date(v); return isNaN(d)?0:d.getTime();
  };
  try{
    const snap=await window.db.collection('posts').where('place_id','==',String(placeId)).get();
    const negs=snap.docs.map(d=>d.data())
      .filter(p=>(Number(p.cleanliness_rating)<=2)||(Array.isArray(p.negative_items)&&p.negative_items.length>0))
      .map(p=>({...p, _ms:toMs(p.created_at)}))
      .sort((a,b)=>b._ms-a._ms);
    if(!negs.length){ box.innerHTML='<div class="good" style="padding:4px 0"><div class="s" style="font-size:12px;color:var(--muted)">キレインのユーザーからの清潔ネガの声は、まだありません。</div></div>'; return; }
    box.innerHTML=negs.slice(0,50).map(p=>{
      const area=(Array.isArray(p.negative_items)&&p.negative_items[0])||'清潔全般';
      const quote=p.negative_comment||p.comment||'（コメントなし）';
      const dateStr=p._ms?new Date(p._ms).toISOString():'';
      return `<div class="alert"><div class="top"><span class="area">${esc(area)}</span><span class="src" style="color:#159079;background:#e6f5f1">キレインのユーザー</span><span class="date">${fmtDate(dateStr)}</span></div><div class="q">${esc(quote)}</div></div>`;
    }).join('');
  }catch(e){ box.innerHTML='<div class="s" style="font-size:12px;color:var(--muted)">読み込みに失敗しました（'+(e.code||'error')+'）。</div>'; }
}

window.pickResp=function(k){
  RESP_STATE=k;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.st===k));
};
window.copyCert=function(){
  const t=$('#certUrl').textContent;
  navigator.clipboard&&navigator.clipboard.writeText(t);
  const b=event.target; const o=b.textContent; b.textContent='コピー済'; setTimeout(()=>b.textContent=o,1400);
};
window.saveResp=async function(id){
  const btn=$('#saveBtn'), msg=$('#savedMsg');
  const comment=($('#respComment').value||'').trim();
  btn.disabled=true; msg.style.color='var(--muted)'; msg.textContent='公開しています…';
  try{
    const res=await fetch(API+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({storeId:id,status:RESP_STATE,comment})});
    const j=await res.json();
    if(res.ok&&j.ok){ msg.style.color='var(--mint)'; msg.textContent='✓ お客様ページに公開しました'; }
    else{ msg.style.color='var(--red)'; msg.textContent='公開に失敗しました（'+(j.error||res.status)+'）'; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='通信に失敗しました。再度お試しください。'; }
  btn.disabled=false;
}

/* ── 未契約：申し込み導線 ── */
function renderOnboard(){
  $('#app').innerHTML=`<div class="hero">
    <div class="ico">🛡️</div>
    <h2>この店舗はまだ登録されていません</h2>
    <p>店名を選ぶだけで、あなたの店のGoogle口コミを24時間、自動で見張ります。<br>清潔に関するネガティブな声を早く掴んで、対応をお客様に見せられます。</p>
    <div class="price">¥3,000<span> / 月</span></div>
    <a class="btn" href="./start.html">見張りを始める →</a>
  </div>`;
}

/* ── 決済直後：反映待ちポーリング ── */
let tries=0;
function renderPending(id,name){
  $('#app').innerHTML=`<div class="hero">
    <div class="ico">🕐</div>
    <h2>${esc(name||'お店')}</h2>
    <p>お支払いを確認して、監視の準備をしています。<br>この画面は自動で切り替わります（最大1分ほど）。</p>
    <div class="spin"></div>
  </div>`;
  setTimeout(()=>load(id,true), 5000);
}

async function load(id,polling){
  if(!id){ renderOnboard(); return; }
  // ローカルプレビュー用モック
  const mock=qp.get('mock');
  if(mock){ return renderMock(mock,id); }
  let j=null, ok=false;
  try{
    const res=await fetch(API+'/store?s='+encodeURIComponent(id));
    j=await res.json(); ok=res.ok;
  }catch(e){ /* ネットワーク */ }
  if(ok && j && j.status==='active'){ renderActive(j); return; }

  // active でない：決済直後（ローカルに直近の店がある）なら反映待ち、そうでなければ申し込み
  const lp=localPlace();
  const justPaid = lp && lp.id===id;
  if(justPaid){
    tries++;
    if(tries<=12){ renderPending(id, lp.name); return; }   // 約1分リトライ
    // それでも来ない：申し込み扱い（未決済 or webhook未達）
  }
  renderOnboard();
}

/* ── モック（?mock=active|pending|onboard、ローカル確認用）── */
function renderMock(mode,id){
  if(mode==='onboard'){ renderOnboard(); return; }
  if(mode==='pending'){ $('#app').innerHTML='';
    renderPending(id,'サンプル食堂'); return; }
  renderActive({
    id:id||'mockplace', name:'サンプル食堂 栄店', status:'active',
    last_checked:'2026-07-31T18:20:00+09:00',
    response:(mode==='active2')?{status:'responded',comment:'手洗い場の清掃を1日3回に増やしました。',updated:'2026-07-30T12:00:00+09:00'}:null,
    alerts:(mode==='active2')?[]:[
      {area:'トイレ',quote:'トイレが少し汚れていて残念でした。',detected:'2026-07-29T21:10:00+09:00',source:'kirein'},
      {area:'におい・換気',quote:'店内のたばこの匂いが気になった。',detected:'2026-07-27T20:00:00+09:00',source:'google'}
    ]
  });
}

load(storeId(), false);
</script>
