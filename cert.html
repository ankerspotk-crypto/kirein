<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>キレイン認証 — 清潔を、見えるように。</title>
<meta name="description" content="この店舗はキレインの覆面調査による清潔認証を受けています。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --pine:#0e3a33;--pine-deep:#082722;--mint:#25b598;--mint-soft:#e6f5f1;
  --gold:#c2a25f;--ink:#182320;--muted:#5d6b66;--line:#e4eae7;
  --bg:#f6f9f8;--card:#fff;--radius:20px;--shadow:0 18px 50px -24px rgba(14,58,51,.34);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif JP",serif}
.wrap{width:min(520px,94vw);margin:0 auto;padding:20px 0 48px}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--pine);font-weight:600;padding:16px 0}
.logo svg{width:24px;height:24px}
.logo b{font-family:"Noto Sans JP";font-size:13px;font-weight:700}

/* 認証カード */
.cert{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.cert-top{padding:34px 28px 26px;text-align:center;color:#fff;position:relative}
.cert-seal{width:118px;height:118px;margin:0 auto 16px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.5);box-shadow:0 10px 30px -8px rgba(0,0,0,.4);position:relative}
.cert-seal .rk{font-family:"Noto Serif JP";font-size:23px;font-weight:700;line-height:1.1}
.cert-seal .lv{font-size:10px;letter-spacing:.18em;opacity:.85;margin-top:3px}
.cert-verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;
  background:rgba(255,255,255,.16);padding:6px 14px;border-radius:999px;margin-bottom:12px}
.cert-h{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:6px}
.cert-sub{font-size:12.5px;opacity:.9}
.cert-rank-sub{font-size:13px;font-weight:700;margin-top:14px;opacity:.95}

/* 店舗名帯 */
.store{padding:22px 28px;text-align:center;border-bottom:1px solid var(--line)}
.store .nm{font-family:"Noto Serif JP";font-size:21px;font-weight:700;color:var(--pine);line-height:1.4}
.store .meta{font-size:12.5px;color:var(--muted);margin-top:6px}

/* スコア */
.scores{padding:24px 28px;border-bottom:1px solid var(--line)}
.scores h3{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:16px;font-family:"Noto Sans JP"}
.score-row{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:12px;margin-bottom:13px}
.score-row .lbl{font-size:13px;font-weight:500}
.score-bar{height:8px;background:var(--mint-soft);border-radius:99px;overflow:hidden}
.score-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#1ea487);border-radius:99px}
.score-row .v{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:700;color:var(--pine);text-align:right}

/* トラスト行 */
.trust{padding:22px 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;border-bottom:1px solid var(--line)}
.trust .t{}
.trust .t .k{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}
.trust .t .v{font-size:13.5px;font-weight:700;color:var(--ink)}
.trust .t.wide{grid-column:1/-1}
.clean{display:inline-flex;align-items:center;gap:7px;background:var(--mint-soft);color:var(--pine);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;margin-top:2px}

/* メッセージ */
.msg{padding:24px 28px;text-align:center;font-size:13.5px;color:var(--muted);line-height:2;font-style:normal}
.msg::before{content:"“";font-family:"Noto Serif JP";font-size:32px;color:var(--mint);display:block;line-height:.4;margin-bottom:8px}

/* フッター説明 */
.about{margin-top:20px;background:var(--card);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.about h3{font-size:14px;color:var(--pine);margin-bottom:10px}
.about p{font-size:12.5px;color:var(--muted);line-height:1.9}
.about .items{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.about .chip{font-size:11.5px;background:var(--mint-soft);color:var(--pine);font-weight:700;padding:6px 12px;border-radius:999px}
.foot{text-align:center;padding:24px 0 4px;font-size:11px;color:#9fb3ac}
.foot a{color:var(--mint);font-weight:700}
.err{background:var(--card);border-radius:var(--radius);padding:40px 28px;text-align:center;box-shadow:var(--shadow)}
.err h2{font-size:18px;color:var(--pine);margin-bottom:10px}
.err p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.2 7-12A7 7 0 0 0 5 10c0 5.8 7 12 7 12Z" fill="#25b598"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>
    Kirein <b>キレイン</b>
  </div>
  <div id="app"><div class="err"><p style="color:#9fb3ac">読み込み中…</p></div></div>

  <div class="foot">
    キレインは、第三者の覆面調査で店舗の清潔さを認証するサービスです。<br>
    <a href="./index.html">キレインについて →</a>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search);

function stars(v){ // 4.8 -> ★★★★★ (簡易)
  const full=Math.round(v);
  return '★★★★★'.slice(0,full)+'☆☆☆☆☆'.slice(0,5-full);
}

function render(data){
  const id=qp.get('s');
  const store=(data.stores||[]).find(s=>s.id===id);
  if(!store){
    $('#app').innerHTML=`<div class="err"><h2>認証情報が見つかりません</h2>
      <p>このQRコードに対応する認証店舗が見つかりませんでした。<br>店舗の方は キレイン運営（${esc(data.meta.contact)}）までご連絡ください。</p></div>`;
    return;
  }
  const rk=data.ranks[store.rank]||data.ranks.silver;
  const items=data.items||Object.keys(store.scores||{});
  const scoreHtml=items.map(it=>{
    const v=(store.scores||{})[it]||0;
    return `<div class="score-row"><span class="lbl">${esc(it)}</span>
      <div class="score-bar"><span style="width:${(v/5*100).toFixed(0)}%"></span></div>
      <span class="v">${v.toFixed(1)}</span></div>`;
  }).join('');
  const light = store.rank==='black' ? '#fff' : (store.rank==='gold' ? '#3a2f10' : '#fff');

  $('#app').innerHTML=`
    <div class="cert">
      <div class="cert-top" style="background:${rk.grad}">
        <div class="cert-verified">✓ キレイン認証済み</div>
        <div class="cert-seal" style="background:rgba(255,255,255,.10)">
          <span class="rk">${esc(rk.label)}</span>
          <span class="lv">KIREIN CERTIFIED</span>
        </div>
        <div class="cert-rank-sub">「${esc(rk.sub)}」</div>
      </div>
      <div class="store">
        <div class="nm">${esc(store.name)}</div>
        <div class="meta">${esc(store.area)}　·　${esc(store.category)}</div>
      </div>
      <div class="scores">
        <h3>清潔評価（5点満点）</h3>
        ${scoreHtml}
      </div>
      <div class="trust">
        ${store.cleaning?`<div class="t wide"><span class="clean">🧽 ${esc(store.cleaning)}</span></div>`:''}
        <div class="t"><div class="k">認証日</div><div class="v">${esc(store.certifiedAt)}</div></div>
        <div class="t"><div class="k">次回調査</div><div class="v">${esc(store.nextAudit)}</div></div>
        <div class="t"><div class="k">調査主体</div><div class="v">${esc(store.auditor)}</div></div>
        <div class="t"><div class="k">累計評価</div><div class="v">${esc(store.reviews)} 件</div></div>
      </div>
      ${store.message?`<div class="msg">${esc(store.message)}</div>`:''}
    </div>

    <div class="about">
      <h3>キレイン認証とは？</h3>
      <p>キレインは、飲食・接客店舗の「清潔さ」を第三者の覆面調査で評価し、基準を満たした店舗のみを認証するサービスです。この認証は、店舗が継続的に清潔を保っている証です。</p>
      <div class="items">
        ${items.map(it=>`<span class="chip">${esc(it)}</span>`).join('')}
      </div>
    </div>`;
  document.title=`${store.name}｜キレイン認証（${rk.label}）`;
}

fetch('stores.json?cb='+Date.now()).then(r=>r.json()).then(render).catch(()=>{
  $('#app').innerHTML=`<div class="err"><h2>読み込みに失敗しました</h2><p>通信環境をご確認のうえ、再度お試しください。</p></div>`;
});
</script>
</body>
</html>
