<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>キレイン｜清潔の声に、向き合っています</title>
<meta name="description" content="この店舗はキレインで公開口コミの清潔監視を受け、お客様の清潔フィードバックに対応しています。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --pine:#0e3a33;--pine-deep:#082722;--mint:#25b598;--mint-soft:#e6f5f1;
  --gold:#c2a25f;--ink:#182320;--muted:#5d6b66;--line:#e4eae7;
  --bg:#f6f9f8;--card:#fff;--radius:20px;--shadow:0 18px 50px -24px rgba(14,58,51,.34);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Noto Serif JP",serif}
.wrap{width:min(520px,94vw);margin:0 auto;padding:20px 0 48px}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--pine);font-weight:600;padding:16px 0}
.logo svg{width:24px;height:24px}
.logo b{font-family:"Noto Sans JP";font-size:13px;font-weight:700}

.cert{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative}
.cert-top{padding:34px 28px 28px;text-align:center;color:#fff;background:linear-gradient(150deg,#12564a,#0e3a33)}
.cert-seal{width:96px;height:96px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.45);box-shadow:0 10px 30px -8px rgba(0,0,0,.4);background:rgba(255,255,255,.1);font-size:42px}
.cert-verified{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;
  background:rgba(255,255,255,.16);padding:6px 14px;border-radius:999px;margin-bottom:14px}
.cert-h{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:6px}
.cert-sub{font-size:12.5px;opacity:.9;line-height:1.8}

/* 店舗名帯 */
.store{padding:22px 28px;text-align:center;border-bottom:1px solid var(--line)}
.store .nm{font-family:"Noto Serif JP";font-size:21px;font-weight:700;color:var(--pine);line-height:1.4}
.store .meta{font-size:12.5px;color:var(--muted);margin-top:8px}
.store .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--pine);background:var(--mint-soft);padding:5px 13px;border-radius:999px;margin-top:12px}
.store .live .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}

/* 監視の説明 */
.watch{padding:24px 28px;border-bottom:1px solid var(--line)}
.watch h3{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:14px;font-family:"Noto Sans JP"}
.watch .row{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.watch .row:last-child{margin-bottom:0}
.watch .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--mint-soft);display:flex;align-items:center;justify-content:center;font-size:17px}
.watch .tx .t{font-size:13.5px;font-weight:700;color:var(--ink)}
.watch .tx .s{font-size:12px;color:var(--muted);margin-top:2px}

/* 対応状況（見せる） */
.response{padding:24px 28px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f4faf8,#fff)}
.resp-head{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:800;padding:8px 17px;border-radius:999px;color:#fff}
.resp-doing{background:linear-gradient(135deg,#e0a100,#c78a00)}
.resp-done{background:linear-gradient(135deg,#25b598,#159079)}
.resp-recheck{background:linear-gradient(135deg,#0e3a33,#12564a)}
.resp-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.8}
.resp-comment{margin-top:14px;padding:15px 17px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--mint);border-radius:10px;font-size:13.5px;color:var(--ink);line-height:1.9}
.resp-comment::before{content:"“";color:var(--mint);font-weight:700}
.resp-comment::after{content:"”";color:var(--mint);font-weight:700}
.resp-date{font-size:11.5px;color:var(--muted);margin-top:10px}
.claimbtn{display:block;text-align:center;margin-top:16px;padding:15px;border-radius:12px;background:var(--mint);color:#06231d;font-weight:800;font-size:15px;text-decoration:none}
.claimbtn:hover{filter:brightness(1.05)}
.claimnote{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.8;text-align:center}

/* フッター説明 */
.about{margin-top:20px;background:var(--card);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow)}
.about h3{font-size:14px;color:var(--pine);margin-bottom:10px}
.about p{font-size:12.5px;color:var(--muted);line-height:1.95}
.foot{text-align:center;padding:24px 0 4px;font-size:11px;color:#9fb3ac;line-height:1.9}
.foot a{color:var(--mint);font-weight:700;text-decoration:none}
.err{background:var(--card);border-radius:var(--radius);padding:40px 28px;text-align:center;box-shadow:var(--shadow)}
.err h2{font-size:18px;color:var(--pine);margin-bottom:10px}
.err p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.2 7-12A7 7 0 0 0 5 10c0 5.8 7 12 7 12Z" fill="#25b598"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>
    Kirein <b>キレイン</b>
  </div>
  <div id="app"><div class="err"><p style="color:#9fb3ac">読み込み中…</p></div></div>

  <div class="foot">
    キレインは、公開されている口コミの清潔さを第三者が監視し、店舗の改善対応を見える化するサービスです。<br>
    清潔さそのものを保証・認証するものではありません。<br>
    <a href="./index.html">キレインについて →</a>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search);
const API='/api';

const RESP_META={
  responding:{label:'お客様の声に対応中',    cls:'resp-doing',  icon:'🔧'},
  responded: {label:'店舗対応済み',          cls:'resp-done',   icon:'✓'},
  rechecked: {label:'キレイン再チェック済み', cls:'resp-recheck',icon:'✓✓'}
};
function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return esc(iso);
  const p=n=>('0'+n).slice(-2);
  return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate());
}
function respHtml(r){
  const m=RESP_META[r.status]; if(!m) return '';
  return '<div class="response">'+
    '<div class="resp-head '+m.cls+'">'+m.icon+' '+m.label+'</div>'+
    '<div class="resp-note">この店舗は、お客様からの清潔フィードバックに向き合っています。ネガティブな口コミの中身・投稿者情報は公開せず、対応状況だけを見える化しています。</div>'+
    (r.comment?('<div class="resp-comment">'+esc(r.comment)+'</div>'):'')+
    (r.updated?('<div class="resp-date">最終更新：'+esc(fmtDate(r.updated))+'</div>'):'')+
  '</div>';
}

function render(st){
  const name=st.name||'この店舗';
  const r=(st.response&&RESP_META[st.response.status])?st.response:null;
  const lastc=fmtDate(st.last_checked);

  $('#app').innerHTML=`
    <div class="cert">
      <div class="cert-top">
        <div class="cert-verified">✓ 清潔の声に、向き合っています</div>
        <div class="cert-seal">🛡️</div>
        <div class="cert-h">この店舗は、清潔の声を<br>見逃しません。</div>
        <div class="cert-sub">Googleの公開口コミをキレインが自動でチェックし、<br>お客様の清潔フィードバックへの対応を見える化しています。</div>
      </div>
      <div class="store">
        <div class="nm">${esc(name)}</div>
        <span class="live"><span class="dot"></span>キレイン見張り 稼働中${lastc?'　·　最終チェック '+lastc:''}</span>
      </div>
      <div class="watch">
        <h3>キレインがしていること</h3>
        <div class="row"><div class="ic">👀</div><div class="tx"><div class="t">気づく</div><div class="s">公開口コミの中の「清潔に関する声」を24時間、自動でチェック。</div></div></div>
        <div class="row"><div class="ic">🔧</div><div class="tx"><div class="t">直す</div><div class="s">気になる声に、この店舗が向き合い対応します。</div></div></div>
        <div class="row"><div class="ic">🤝</div><div class="tx"><div class="t">見せる</div><div class="s">対応した事実だけを、あなたにこうしてお見せしています。</div></div></div>
      </div>
      ${r?respHtml(r):`<div class="response"><div class="resp-note" style="margin-top:0">この店舗は清潔の声の見張りを始めました。お客様の声への対応状況は、これからここに表示されます。</div></div>`}
    </div>

    <div class="about">
      <h3>キレインとは？</h3>
      <p>キレインは、飲食・接客店舗に寄せられる<b>公開口コミの「清潔さ」を第三者として監視</b>し、店舗がその声にどう対応したかを見える化するサービスです。清潔さそのものを保証・認証するものではなく、ネガティブな口コミの中身や投稿者情報を公開することもありません。見える化するのは「向き合っている」という姿勢だけです。</p>
    </div>`;
  document.title=`${name}｜キレイン｜清潔の声に、向き合っています`;
}

function showErr(){
  $('#app').innerHTML=`<div class="err"><h2>チェック情報が見つかりません</h2>
    <p>このQRコード／リンクに対応する店舗が見つかりませんでした。<br>店舗の方は キレイン運営（kirein.jp@gmail.com）までご連絡ください。</p></div>`;
}

/* ===== 未登録店＝Claim招待ビュー（店が自分で気づいて入ってくる受け皿） ===== */
function claimView(id,name,addr){
  const nm=name||'この店舗';
  const q='./start.html?s='+encodeURIComponent(id)
        +(name?('&n='+encodeURIComponent(name)):'')
        +(addr?('&a='+encodeURIComponent(addr)):'');
  $('#app').innerHTML=`
    <div class="cert">
      <div class="cert-top">
        <div class="cert-verified">お客様の声が、届く場所</div>
        <div class="cert-seal">📣</div>
        <div class="cert-h">${esc(nm)} の<br>清潔の声を、受け付けています。</div>
        <div class="cert-sub">キレインでは、お客様がこの店舗の清潔について声を届けられます。<br>店舗の方は、届いた声を確認し、対応を公表できます。</div>
      </div>
      <div class="watch">
        <h3>店舗の方へ</h3>
        <div class="row"><div class="ic">📨</div><div class="tx"><div class="t">届いた声を確認できる</div><div class="s">お客様から届いた清潔の声を、店舗だけが確認できます。中身は一般には公開されません。</div></div></div>
        <div class="row"><div class="ic">🔧</div><div class="tx"><div class="t">対応を公表できる</div><div class="s">「対応中／対応済み」を、このページでお客様に見せられます。</div></div></div>
        <div class="row"><div class="ic">👀</div><div class="tx"><div class="t">これからの声も見張る</div><div class="s">Google等の公開口コミの清潔の声も、24時間自動でチェックします。</div></div></div>
      </div>
      <div class="response">
        <div class="resp-note" style="margin-top:0">この店舗はまだキレインの見張りを始めていません。<b>店舗の方は、月¥3,000でこの店舗の清潔の声を確認・対応できます。</b></div>
        <a class="claimbtn" href="${q}">この店舗の見張りを始める（月¥3,000）→</a>
        <div class="claimnote">いつでも解約可。基本は自動監視、必要に応じて覆面調査員が調査することがあります。<br>キレインは清潔さを保証・認証するものではなく、公開されている声の中身・投稿者情報を公開することもありません。</div>
      </div>
    </div>
    <div class="about">
      <h3>キレインとは？</h3>
      <p>キレインは、お客様が感じた店舗の清潔面の声を店舗に届け、店舗がどう対応したかを見える化する第三者チェックサービスです。清潔さそのものを保証・認証するものではなく、ネガティブな声の中身や投稿者情報を公開することもありません。</p>
    </div>`;
  document.title=`${nm}｜キレイン｜清潔の声を受け付けています`;
}
let _mapsLoading=false,_mapsReady=false;
function loadMaps(cb){
  if(_mapsReady){ cb(); return; }
  if(_mapsLoading){ setTimeout(()=>loadMaps(cb),300); return; }
  _mapsLoading=true;
  window.__certMapsCb=()=>{ _mapsReady=true; cb(); };
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key=AIzaSyDRfloVijkhdUhF9v_DG7O3JV17Fqd9V7w&libraries=places&language=ja&callback=__certMapsCb';
  s.async=true; s.onerror=()=>{}; document.head.appendChild(s);
}
function renderClaim(id){
  const n=qp.get('n'), a=qp.get('a');
  claimView(id,n,a);                 // まず即描画（リンクに名前があればそれで完成）
  if(n) return;                      // 名前あり＝Places不要
  loadMaps(()=>{                     // 名前なし＝Placesで店名を後追い解決
    try{
      const svc=new google.maps.places.PlacesService(document.createElement('div'));
      svc.getDetails({placeId:id,fields:['name','formatted_address']},(p,st)=>{
        if(st===google.maps.places.PlacesServiceStatus.OK && p && p.name) claimView(id,p.name,p.formatted_address);
      });
    }catch(e){}
  });
}

async function main(){
  const id=qp.get('s');
  if(!id){ showErr(); return; }
  const mock=qp.get('mock');
  if(mock==='claim'){ return claimView(id,'サンプル食堂 栄店','愛知県名古屋市中区栄3-1-1'); }
  if(mock){ return render(MOCK(mock,id)); }
  try{
    const res=await fetch(API+'/store?s='+encodeURIComponent(id));
    const j=await res.json();
    if(res.ok && j && j.status==='active'){ render(j); }
    else renderClaim(id);
  }catch(e){
    $('#app').innerHTML=`<div class="err"><h2>読み込みに失敗しました</h2><p>通信環境をご確認のうえ、再度お試しください。</p></div>`;
  }
}
function MOCK(mode,id){
  return {id,name:'サンプル食堂 栄店',status:'active',last_checked:'2026-07-31T18:20:00+09:00',
    response: mode==='resp'?{status:'responded',comment:'手洗い場の清掃頻度を1日3回に見直しました。',updated:'2026-07-30T00:00:00+09:00'}:null};
}
main();
</script>
</body>
</html>
